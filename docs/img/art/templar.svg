      <g transform="rotate(18 300 260)"><rect x="294" y="110" width="13" height="210" rx="3" fill="#d6dcea"/><path d="M294 110 L300 80 L307 110 Z" fill="#eef2f8"/>
      <rect x="276" y="318" width="50" height="10" rx="3" fill="#2a2f3c" stroke="#6d9be0" stroke-width="2"/><rect x="296" y="328" width="9" height="40" fill="#3a2a22"/></g>
  
  <!-- cloak -->
