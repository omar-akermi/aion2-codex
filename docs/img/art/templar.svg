<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d9be0"/><stop offset=".6" stop-color="#6d9be0" stop-opacity=".35"/><stop offset="1" stop-color="#ffffff" stop-opacity=".2"/></linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2232"/><stop offset="1" stop-color="#0b0e15"/></linearGradient>
    <radialGradient id="bg" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#6d9be0" stop-opacity=".45"/><stop offset="1" stop-color="#6d9be0" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#6d9be0"/><stop offset="1" stop-color="#10202a"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <ellipse cx="200" cy="230" rx="200" ry="230" fill="url(#bg)"/>
  <path d="M60 250 C60 205 120 190 140 196 C160 190 220 205 220 250 C220 330 160 380 140 392 C120 380 60 330 60 250 Z" transform="translate(-30 0)" fill="#1c2638" stroke="url(#rim)" stroke-width="4"/>
